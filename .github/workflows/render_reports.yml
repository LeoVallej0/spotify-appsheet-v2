          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from PIL import Image

          payload = json.loads(Path('payload.json').read_text(encoding='utf-8'))
          out = Path('artifacts/real_render_test')
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          callback_url = str(payload.get('callbackUrl', '')).strip()
          secret = os.environ.get('CALLBACK_SECRET', '').strip()

          if not callback_url:
              raise SystemExit('Falta payload.callbackUrl')
          if not secret:
              raise SystemExit('Falta el secreto GitHub RENDER_CALLBACK_SECRET')

          with (out / 'history_real.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))

          # Contrato real del renderer V16: manifest.parts es el contador;
          # los nombres de archivo están en manifest.render.part_files.
          render = manifest.get('render') or {}
          part_files = render.get('part_files') or []
          part_row_counts = manifest.get('partRowCounts') or []
          part_heights = manifest.get('partHeights') or []
          part_size = manifest.get('partSize') or [1080, 1920]
          if not isinstance(part_files, list) or not part_files:
              raise SystemExit('manifest.render.part_files no contiene una lista de imágenes')
          if int(manifest.get('parts', -1)) != len(part_files):
              raise SystemExit('manifest.parts no coincide con render.part_files')
          if int(render.get('parts', -1)) != len(part_files):
              raise SystemExit('render.parts no coincide con render.part_files')
          if len(part_row_counts) != len(part_files) or len(part_heights) != len(part_files):
              raise SystemExit('partRowCounts/partHeights no coincide con render.part_files')

          image_parts = []
          expected_start_row = 1
          for index, filename_value in enumerate(part_files):
              filename = str(filename_value).strip()
              image_path = out / filename
              if not filename or not image_path.is_file():
                  raise SystemExit(f'No existe el PNG listado por manifest.render.part_files: {filename}')
              row_count = int(part_row_counts[index])
              height_from_manifest = int(part_heights[index])
              start_row = expected_start_row
              end_row = start_row + row_count - 1
              if row_count < 1:
                  raise SystemExit(f'La parte {index + 1} tiene rowCount no válido: {row_count}')
              with Image.open(image_path) as img:
                  width, height = img.size
              if width != int(part_size[0]) or height != height_from_manifest:
                  raise SystemExit(f'El tamaño de {filename} no coincide con partSize/partHeights del manifiesto')

              image_parts.append({
                  'partNumber': index + 1,
                  'fileName': filename,
                  'mimeType': 'image/png',
                  'imageBase64': base64.b64encode(image_path.read_bytes()).decode('ascii'),
                  'width': int(width),
                  'height': int(height),
                  'startRow': int(start_row),
                  'endRow': int(end_row),
                  'rowCount': int(row_count),
                  'isFinalPart': index == len(part_files) - 1,
              })
              expected_start_row = end_row + 1

          if expected_start_row - 1 != len(rows):
              raise SystemExit(f'Las partes cubren {expected_start_row - 1} filas, CSV tiene {len(rows)}')

          report_payload = {
              'type': 'report_result',
              'recordId': payload.get('recordId', ''),
              'reportId': payload.get('reportId', ''),
              'solicitudId': payload.get('solicitudId', ''),
              'idAgenda': payload.get('idAgenda', ''),
              'playlistName': payload.get('playlistName', 'Playlist'),
              'referenceTime': payload.get('referenceTime', ''),
              'generatedAt': payload.get('generatedAt', ''),
              'generationMode': payload.get('generationMode', 'manual'),
              'finalTimeHHMM': payload.get('finalTimeHHMM', ''),
              'officialCount': sum(1 for r in rows if r.get('origen') == 'playlist_x'),
              'randomCount': 0,
              'totalRows': len(rows),
              'totalParts': len(image_parts),
              'images': image_parts,
          }

          separator = '&' if '?' in callback_url else '?'
          url = callback_url + separator + urllib.parse.urlencode({'key': secret})
          req = urllib.request.Request(
              url,
              data=json.dumps(report_payload).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'GitHubActions-SpotifyReportRenderer/2.1.2',
              },
              method='POST',
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  status = response.status
                  response_body = response.read().decode('utf-8', errors='replace')
          except Exception as exc:
              raise SystemExit(f'Callback a Apps Script falló: {exc}')

          print('Apps Script callback HTTP:', status)
          print('Apps Script callback response:', response_body[:3000])
          if not 200 <= status < 300:
              raise SystemExit(f'Callback devolvió HTTP {status}')

          result = json.loads(response_body)
          if result.get('ok') is not True:
              raise SystemExit(f'Apps Script devolvió error: {result}')
          print('CALLBACK OK')
          print('recordId:', result.get('recordId', ''))
          print('reportId:', result.get('reportId', ''))
          print('solicitudId:', result.get('solicitudId', ''))
          print('partsCount:', result.get('partsCount', result.get('totalParts', '')))
          PY

    concurrency:
      group: spotify-report-${{ github.event.client_payload.reportId || github.event.client_payload.idAgenda || github.run_id }}
      cancel-in-progress: false
